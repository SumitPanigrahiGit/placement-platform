<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Placement Platform</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--mu:#667085;--ac:#2563eb;--bd:#e4e7ec;--er:#b42318;--ok:#067647}
@media (prefers-color-scheme:dark){:root{--bg:#0f1115;--card:#181b21;--tx:#e8eaed;--mu:#9aa3b2;--ac:#6b9bff;--bd:#2a2f38;--er:#ff8a80;--ok:#5fd39a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,sans-serif}
main{max-width:760px;margin:0 auto;padding:24px 16px}
h1{font-size:1.5rem;margin:0 0 4px}.sub{color:var(--mu);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
input{width:100%;padding:10px;margin:4px 0 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
button{padding:9px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:inherit;cursor:pointer}
button.ghost{background:transparent;color:var(--ac);border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.msg{min-height:1.4em;margin:6px 0}.err{color:var(--er)}.ok{color:var(--ok)}
.job{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;border-top:1px solid var(--bd);padding:12px 0}
.job:first-child{border-top:0}.job small{color:var(--mu)}
.hide{display:none}
</style></head><body><main>
<h1>Placement Platform</h1>
<p class="sub">Job postings and applications. FastAPI + PostgreSQL on AWS.</p>

<section id="auth" class="card">
  <div class="row"><button id="tabLogin">Log in</button><button id="tabSignup" class="ghost">Sign up</button></div>
  <form id="form">
    <div id="nameWrap" class="hide"><label>Name<input id="name" autocomplete="name"></label>
    <label>Skills (comma separated)<input id="skills" placeholder="python, sql, aws"></label></div>
    <label>Email<input id="email" type="email" required autocomplete="email"></label>
    <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
    <button id="submit" type="submit">Log in</button>
  </form>
  <div id="authMsg" class="msg" role="status"></div>
</section>

<section id="app" class="card hide">
  <div class="row" style="justify-content:space-between">
    <strong id="who"></strong><button id="logout" class="ghost">Log out</button>
  </div>
  <div id="appMsg" class="msg" role="status"></div>
  <h2 style="font-size:1.1rem">Open postings</h2>
  <div id="jobs">Loading...</div>
</section>
</main>
<script>
const $ = id => document.getElementById(id);
let mode = "login";
const tok = () => { try { return sessionStorage.getItem("token"); } catch { return null; } };
const setTok = t => { try { t ? sessionStorage.setItem("token", t) : sessionStorage.removeItem("token"); } catch {} };

async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (tok()) headers.Authorization = "Bearer " + tok();
  const r = await fetch(path, { ...opts, headers });
  let data = null; try { data = await r.json(); } catch {}
  if (!r.ok) {
    let d = data && data.detail;
    if (Array.isArray(d)) d = d.map(x => x.msg).join("; ");
    const e = new Error(r.status === 429 ? "Too many attempts. Wait a minute and try again." : (d || "Request failed (" + r.status + ")"));
    e.status = r.status; throw e;
  }
  return data;
}
function say(el, text, cls) { el.textContent = text; el.className = "msg " + (cls || ""); }

function setMode(m) {
  mode = m;
  $("nameWrap").classList.toggle("hide", m !== "signup");
  $("submit").textContent = m === "signup" ? "Create account" : "Log in";
  $("tabLogin").className = m === "login" ? "" : "ghost";
  $("tabSignup").className = m === "signup" ? "" : "ghost";
  say($("authMsg"), "");
}
$("tabLogin").onclick = () => setMode("login");
$("tabSignup").onclick = () => setMode("signup");

async function doLogin(email, password) {
  const d = await api("/login", { method: "POST", body: JSON.stringify({ email, password }) });
  const t = d && (d.access_token || d.token);
  if (!t) throw new Error("Login worked but no token was returned.");
  setTok(t);
}

$("form").onsubmit = async ev => {
  ev.preventDefault();
  const email = $("email").value.trim(), password = $("password").value;
  try {
    if (mode === "signup") {
      await api("/signup", { method: "POST", body: JSON.stringify({ name: $("name").value.trim(), email, password, skills: $("skills").value.trim() }) });
    }
    await doLogin(email, password);
    $("password").value = "";
    await showApp();
  } catch (e) { say($("authMsg"), e.message, "err"); }
};

$("logout").onclick = () => { setTok(null); $("auth").classList.remove("hide"); $("app").classList.add("hide"); };

async function showApp() {
  try {
    const me = await api("/me");
    $("who").textContent = "Signed in as " + (me.email || me.sub || me.name || "user");
  } catch (e) {
    setTok(null); say($("authMsg"), "Session expired. Please log in again.", "err"); return;
  }
  $("auth").classList.add("hide"); $("app").classList.remove("hide");
  say($("appMsg"), "");
  await loadJobs();
}

async function loadJobs() {
  const box = $("jobs"); box.textContent = "";
  try {
    const jobs = await api("/postings");
    if (!jobs.length) { box.textContent = "No postings yet."; return; }
    for (const j of jobs) {
      const row = document.createElement("div"); row.className = "job";
      const info = document.createElement("div");
      const t = document.createElement("strong"); t.textContent = j.role_title;
      const c = document.createElement("div"); c.textContent = j.company_name;
      const s = document.createElement("small"); s.textContent = j.required_skills || "";
      info.append(t, c, s);
      const b = document.createElement("button"); b.textContent = "Apply";
      b.onclick = () => apply(j.id, b);
      row.append(info, b); box.append(row);
    }
  } catch (e) { say($("appMsg"), e.message, "err"); }
}

async function apply(id, btn) {
  btn.disabled = true;
  try {
    await api("/applications", { method: "POST", body: JSON.stringify({ posting_id: id }) });
    say($("appMsg"), "Applied.", "ok"); btn.textContent = "Applied";
  } catch (e) { say($("appMsg"), e.message, "err"); btn.disabled = false; }
}

if (tok()) showApp();
</script></body></html>
